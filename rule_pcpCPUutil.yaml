- name: Listen for RHEL Performance Co-Pilot events
  hosts: all
  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Collect CPU utilization data
      condition: event.payload.pcp.pmie.rule == "High average processor utilization"      
      action:
        run_playbook:
          name: playbooks/manage_cpus/cpu.util.collect_data.yaml

    - name: Set performance rule
      condition: event.payload.pcp.pmie.rule == "High average processor utilization"      
      action:
        run_playbook:
          name: playbooks/manage_cpus/cpu.util.set_performance.yaml

    #- name: Stop the regular tasks when High average processor utilization. Make sure it will reschedule in low CPU utilization time.
